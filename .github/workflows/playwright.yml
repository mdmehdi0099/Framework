name: Playwright Tests

on: 
  push: 
    branches: [main, master] 

  pull_request: 
    branches: [main, master]

jobs: 
  test: 
    timeout-minutes: 60 
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: npm

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium

    - name: Clean previous reports
      run: |
        rm -rf reports/json reports/html
        mkdir -p reports/json reports/html

    - name: Run Automation Tests
      id: tests
      continue-on-error: true
      run: node runner/TestRunner.js --env=qa --browser=chromium --parallel=1 '--tags=@C2'

    - name: Verify generated reports
      if: always()
      run: |
        echo "Checking generated reports..."
        ls -la reports/json/ || true
        ls -la reports/html/ || true

    - name: Upload Cucumber Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: cucumber-test-reports
        path: |
          reports/json/cucumber-report.json
          reports/html/cucumber-report.html
        if-no-files-found: warn
        retention-days: 30

    - name: Set final test status
      if: always()
      env:
        TEST_OUTCOME: ${{ steps.tests.outcome }}
      run: |
        if [ "$TEST_OUTCOME" != "success" ]; then
          echo "Automation tests failed. Check the test logs and downloaded report."
          exit 1
        fi
        echo "All automation tests passed."