name: Playwright Tests

on: 
  push: 
    branches: [main, master] 

  pull_request: 
    branches: [main, master]

jobs: 
  test: 
    timeout-minutes: 60 
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      
      with:
        node-version: lts/*
        cache: npm

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium

    - name: Run Automation Tests
      run: node runner/TestRunner.js --env=qa --browser=chromium --parallel=1 '--tags=@C1'

    - name: Upload Test Reports
      uses: actions/upload-artifact@v4
    
      if: always()
      with:
        name: cucumber-test-reports
        path: |
          reports/
          test-results/
          playwright-report/
        if-no-files-found: ignore
        retention-days: 30

    - name: Set final test status
      if: always()
      env:
        TEST_OUTCOME: ${{ steps.tests.outcome }}
      run: |
          if [ "$TEST_OUTCOME" != "success" ]; then
            echo "Automation tests failed. Check the test logs and downloaded report."
            exit 1
          fi
            echo "All automation tests passed."